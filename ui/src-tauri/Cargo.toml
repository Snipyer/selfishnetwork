[package]
name = "selfishnet-ui"
version = "0.1.0"
description = "SelfishNetwork desktop shell"
authors = ["Snipyer <snipyergaming@gmail.com>"]
edition = "2021"

# The library holds all app logic so the same code path works on every target;
# main.rs is a thin launcher. See lib.rs::run().
[lib]
name = "selfishnet_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

# Used to stop the core gracefully (SIGTERM) and to tie its lifetime to ours
# via PR_SET_PDEATHSIG, so it can never be orphaned onto the control port.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
