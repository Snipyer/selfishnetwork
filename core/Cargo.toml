[package]
name = "selfishnet-core"
version = "0.1.0"
edition = "2021"
description = "Privileged network core for SelfishNet: ARP discovery, MITM, userspace forwarding & throttling"
license = "MIT"

[[bin]]
name = "selfishnet-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pnet = "0.35"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
